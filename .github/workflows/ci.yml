name: CI

# Tests in three processes (unit, full host, integration), the Incus lab recordings matching the incus-worker commit
# they name (Titan.Tests/Infrastructure/Incus/testdata/SOURCE, synced by scripts/sync-incus-testdata.sh), the worker
# routing every command kind this commit enqueues, and the image, pushed only from main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: titan
          POSTGRES_PASSWORD: titan
          POSTGRES_DB: titan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # titan-ops is private, so a link into it is a 404 for every reader of this repository; a titan-ops doc is named
      # `titan-ops <path under its docs/>#<anchor>` instead.
      - name: No URL into private titan-ops
        run: |
          if git grep -n -I -i -E 'github\.com/openvicloud/titan-ops([^[:alnum:]_-]|$)' -- ':/'; then
            echo "URL into private titan-ops above: write titan-ops <path>#<anchor>"; exit 1
          fi

      - name: Lab recordings match testdata/SOURCE
        run: |
          dir=Titan.Tests/Infrastructure/Incus/testdata
          sha=$(cat "$dir/SOURCE")
          for file in lab-tls-shapes-2026-10-07.log lab-untrusted-2026-10-07.log; do
            curl -fsSL "https://raw.githubusercontent.com/OpenViCloud/titan-incus-worker/$sha/incus/provider/testdata/$file" \
              | cmp - "$dir/$file"
          done

      # The SDK the projects (net9.0) need, from the same file local builds read.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Unit + endpoint + schema tests (InMemory / fakes / Factory.Create). Excludes FullHost and
      # Integration: FastEndpoints keeps a global static ServiceResolver that WebApplicationFactory
      # tests set and dispose, so a Factory.Create test sharing this pool can read a disposed provider
      # (ObjectDisposedException). test-all.sh runs the same three steps locally.
      - name: Test (unit)
        run: dotnet test --no-build --configuration Release --verbosity normal --filter "Category!=Integration&Category!=FullHost"
        env:
          ConnectionStrings__Titan: "Host=localhost;Database=titan_test;Username=titan;Password=titan"

      # WebApplicationFactory full-host tests (CORS, health, OpenAPI, catalog contract), on their own Postgres
      # (Testcontainers, as integration). Own process
      # so they never share the FastEndpoints global ServiceResolver pool with Factory.Create tests.
      - name: Test (full-host — WebApplicationFactory)
        run: dotnet test --no-build --configuration Release --verbosity normal --filter "Category=FullHost"
        env:
          ConnectionStrings__Titan: "Host=localhost;Database=titan_test;Username=titan;Password=titan"

      # Postgres-backed integration tests. Testcontainers starts its own
      # postgres:16 via the runner's Docker daemon — independent of the service container above.
      - name: Test (integration — Testcontainers)
        run: dotnet test --no-build --configuration Release --verbosity normal --filter "Category=Integration"

  # The control plane enqueues only kinds the worker on main already routes: the worker ships a new kind first
  # (titan-ops architecture/provider-and-worker.md#contract-changes).
  worker-kinds:
    name: Worker routes every kind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: control-plane

      - uses: actions/checkout@v4
        with:
          repository: OpenViCloud/titan-incus-worker
          ref: main
          path: incus-worker

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: incus-worker/go.sum

      # The worker's routing test, fed this commit's kinds. The PASS line is required: a renamed test would
      # otherwise run nothing and exit 0.
      - name: Worker's routes against this commit's kinds
        working-directory: incus-worker
        run: |
          set -o pipefail
          cp ../control-plane/Titan.Domain/Aggregates/ProviderCommand/ProviderCommandKinds.cs contract/
          go test -count=1 -run '^TestRoutes_CoverTheControlPlanesKinds$' -v . | tee ../routes.log
          grep -q '^--- PASS: TestRoutes_CoverTheControlPlanesKinds' ../routes.log

  # Built on every run beside the tests, its layers kept in the Actions cache. Pushed only from main, once the tests
  # passed, by the push job reading those layers back, tagged with the commit's first 7 characters. The source label
  # links the package to this repository. Which tag an environment runs is decided outside this repository: dev by
  # scripts/pull-images.py of OpenViCloud/titan-local-cluster, staging by a release of OpenViCloud/titan-ops. This
  # repository holds no credential for either (titan-ops architecture/platform-infra.md#gitops-flow).
  image:
    name: Image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: false
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=titan-control-plane
          cache-to: type=gha,mode=max,scope=titan-control-plane

  push:
    name: Image push
    runs-on: ubuntu-latest
    needs: [test, worker-kinds, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ghcr.io/openvicloud/titan-control-plane:${{ env.SHORT_SHA }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=titan-control-plane
